<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>

    <style>
        body {
            margin: 0;
            background: #87CEEB;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin: 20px 0 5px;
            color: white;
        }

        #score {
            color: white;
            font-size: 20px;
            margin-bottom: 10px;
        }

        canvas {
            background: #87CEEB;
            border: 4px solid white;
            display: block;
            margin: auto;
        }

        #gameOver {
            display: none;
            color: white;
            font-size: 25px;
            font-weight: bold;
            margin-top: 15px;
        }

        button {
            margin-top: 15px;
            padding: 10px 25px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>🐍 Snake Game</h1>

    <div id="score">Skor: 0</div>

    <canvas id="game" width="600" height="400"></canvas>

    <div id="gameOver">
        GAME OVER!
        <br>
        <button onclick="restartGame()">🔄 Main Lagi</button>
    </div>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        const GRID_SIZE = 20;

        let snake;
        let direction;
        let foods;
        let score;
        let gameOver;
        let gameSpeed;
        let gameInterval;

        const foodColors = [
            "#FF0000",
            "#FF69B4",
            "#FFD700",
            "#9B59B6",
            "#2ECC71",
            "#E67E22",
            "#F1C40F"
        ];

        function randomPosition() {
            return {
                x: Math.floor(Math.random() * (canvas.width / GRID_SIZE)) * GRID_SIZE,
                y: Math.floor(Math.random() * (canvas.height / GRID_SIZE)) * GRID_SIZE
            };
        }

        function createFood() {
            let position;

            do {
                position = randomPosition();
            } while (
                snake.some(segment =>
                    segment.x === position.x &&
                    segment.y === position.y
                )
            );

            return {
                x: position.x,
                y: position.y,
                color: foodColors[Math.floor(Math.random() * foodColors.length)]
            };
        }

        function createFoods() {
            foods = [];

            for (let i = 0; i < 7; i++) {
                foods.push(createFood());
            }
        }

        function restartGame() {
            snake = [
                { x: 100, y: 100 },
                { x: 80, y: 100 },
                { x: 60, y: 100 }
            ];

            direction = {
                x: GRID_SIZE,
                y: 0
            };

            score = 0;
            gameOver = false;
            gameSpeed = 120;

            document.getElementById("score").textContent =
                "Skor: " + score;

            document.getElementById("gameOver").style.display = "none";

            createFoods();

            clearInterval(gameInterval);

            gameInterval = setInterval(gameLoop, gameSpeed);
        }

        document.addEventListener("keydown", function(event) {

            if (
                (event.key === "ArrowUp" || event.key.toLowerCase() === "w") &&
                direction.y === 0
            ) {
                direction = {
                    x: 0,
                    y: -GRID_SIZE
                };
            }

            if (
                (event.key === "ArrowDown" || event.key.toLowerCase() === "s") &&
                direction.y === 0
            ) {
                direction = {
                    x: 0,
                    y: GRID_SIZE
                };
            }

            if (
                (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") &&
                direction.x === 0
            ) {
                direction = {
                    x: -GRID_SIZE,
                    y: 0
                };
            }

            if (
                (event.key === "ArrowRight" || event.key.toLowerCase() === "d") &&
                direction.x === 0
            ) {
                direction = {
                    x: GRID_SIZE,
                    y: 0
                };
            }
        });

        function checkCollision(head) {

            if (
                head.x < 0 ||
                head.x >= canvas.width ||
                head.y < 0 ||
                head.y >= canvas.height
            ) {
                return true;
            }

            for (let i = 0; i < snake.length; i++) {
                if (
                    head.x === snake[i].x &&
                    head.y === snake[i].y
                ) {
                    return true;
                }
            }

            return false;
        }

        function drawGrid() {

            ctx.strokeStyle = "white";
            ctx.lineWidth = 1;

            for (let x = 0; x <= canvas.width; x += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }

            for (let y = 0; y <= canvas.height; y += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }

        function drawSnake() {

            snake.forEach(segment => {

                ctx.fillStyle = "#27AE60";

                ctx.fillRect(
                    segment.x + 1,
                    segment.y + 1,
                    GRID_SIZE - 2,
                    GRID_SIZE - 2
                );
            });

            const head = snake[0];

            ctx.fillStyle = "black";

            ctx.fillRect(
                head.x + 5,
                head.y + 5,
                4,
                4
            );

            ctx.fillRect(
                head.x + 11,
                head.y + 5,
                4,
                4
            );
        }

        function drawApple(food) {

            ctx.fillStyle = food.color;

            ctx.beginPath();

            ctx.arc(
                food.x + 10,
                food.y + 11,
                8,
                0,
                Math.PI * 2
            );

            ctx.fill();

            ctx.fillStyle = "green";

            ctx.fillRect(
                food.x + 9,
                food.y + 1,
                3,
                5
            );
        }

        function drawFood(food) {

            ctx.fillStyle = food.color;

            ctx.beginPath();

            ctx.arc(
                food.x + 10,
                food.y + 10,
                8,
                0,
                Math.PI * 2
            );

            ctx.fill();

            ctx.fillStyle = "white";

            ctx.fillRect(
                food.x + 6,
                food.y + 6,
                3,
                3
            );
        }

        function drawFoods() {

            foods.forEach(food => {
                drawFood(food);
            });
        }

        function gameLoop() {

            if (gameOver) {
                return;
            }

            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };

            if (checkCollision(head)) {
                endGame();
                return;
            }

            snake.unshift(head);

            let makan = false;

            for (let i = 0; i < foods.length; i++) {

                if (
                    head.x === foods[i].x &&
                    head.y === foods[i].y
                ) {

                    makan = true;

                    score++;

                    document.getElementById("score").textContent =
                        "Skor: " + score;

                    foods[i] = createFood();

                    break;
                }
            }

            if (!makan) {
                snake.pop();
            }

            drawGame();
        }

        function drawGame() {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            drawGrid();
            drawSnake();
            drawFoods();
        }

        function endGame() {

            gameOver = true;

            clearInterval(gameInterval);

            document.getElementById("gameOver").style.display =
                "block";
        }

        restartGame();
    </script>

</body>
</html>
